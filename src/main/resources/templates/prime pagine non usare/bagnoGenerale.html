<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" lang="it">
<head>
    <title>Elenco Bagni</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"
            integrity="sha384-0gxUXCCR8yv9FM2b+U3FDbsKthCI66oH5IA9fHppQq9DDMHuMauqq1ZHBpJxQ0J0"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11/dist/ext/json-enc.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<div class="container">
    <h1>Bagno</h1>
    <div class="card">
        <div th:replace="~{bagnoModifica :: showCardBagno}"
             th:with="bagno=${bagno}"></div>
    </div>
    <h3>Alimentazione</h3>
    <div class="card" th:each="alimentazione:${bagno.getAlimentazioneList()}">
        <div>Id Alimentazione: <span
                th:text="${alimentazione.getIdAlimentazione()}"/></div>
        <div>Scatti: <span th:text="${alimentazione.getScatti()}"/></div>
        <div>Tempo: <span th:text="${alimentazione.getTempo()}"/></div>
        <div>Descrizione: <span th:text="${alimentazione.getDescrizione()}"/></div>
        <div class="card"
             th:each="dettaglio:${alimentazione.getDettaglioAlimentazioneList()}">
            <div>Id Dettaglio: <span th:text="${dettaglio.getIdDettaglio()}"/></div>
            <div>Note: <span th:text="${dettaglio.getNote()}"/></div>
            <div>Quantità prodotto: <span
                    th:text="${dettaglio.getQuantitaProdotto()}"/> <span
                    th:text="${dettaglio.getUnitaDiMisura()}"/></div>
            <div>Prodotto: <span th:text="${dettaglio.getProdotto().getNome()}"/>
            </div>
        </div>
    </div>

    <h3>Prodotti</h3>
    <div class="card" th:each="relazione:${bagno.getRelazioneBagnoProdottoList()}">
        <div>id Relazione: <span th:text="${relazione.getIdRelazione()}"/></div>
        <div>Prodotto: <span th:text="${relazione.getProdotto().getNome()}"/></div>
        <div>Note: <span th:text="${relazione.getNote()}"/></div>
    </div>

    <h3>Storico Aggiunte</h3>
    <div class="card" th:each="storico:${storicoList}">
        <div>Id Storico: <span th:text="${storico.getIdStorico()}"/></div>
        <div>Resto Scatti: <span th:text="${storico.getRestoScatti()}"/></div>
        <div>Data Creazione: <span th:text="${storico.getDataCreazione()}"/></div>
        <div>Data Fine: <span th:text="${storico.getDataFine()}"/></div>
        <div>SonoScatti: <span th:text="${storico.getSonoScatti()}"/></div>
        <div class="card"
             th:each="dettaglioStorico:${storico.getStoricoDettaglioList()}">
            <div> Id dettaglio: <span
                    th:text="${dettaglioStorico.getIdStoricoDettaglio()}"/></div>
            <div>Prodotto: <span
                    th:text="${dettaglioStorico.getProdotto().getNome()}"/></div>
            <div>Quantità: <span
                    th:text="${dettaglioStorico.getQuantita()}"/>
                <span th:text="${dettaglioStorico.getUnitaDiMisura()}"/></div>
            <div>Escluso: <span
                    th:text="${dettaglioStorico.getEscluso()}"/></div>
            <div>Eseguito: <span
                    th:text="${dettaglioStorico.getEseguito()}"/></div>
        </div>
    </div>


</div>
</body>
</html>
