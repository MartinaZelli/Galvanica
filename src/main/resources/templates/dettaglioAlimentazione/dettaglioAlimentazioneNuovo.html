<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main_layout}">

<head>
    <title>Azioni su Relazioni</title>
</head>

<body>
<div layout:fragment="content">

    <form th:attr="hx-post=@{'/relazioneBagnoProdotto'}"
          hx-ext="json-enc"
          hx-target="body"
          hx-swap="outerHTML">
        <div>
            Bagno: <span th:text="${bagno.getNome()}"></span>
            <input type="hidden" id="idBagno" name="idBagno"
                   th:value="${bagno.getIdBagno()}">
        </div>
        <div>
            <label for="idProdotto">Nome Prodotto </label>
            <select name="idProdotto" id="idProdotto">
                <option></option>
                <option th:each="prodotto: ${prodottoList}"
                        th:value="${prodotto.getIdProdotto()}"
                        th:text="${prodotto.getNome()}">
                </option>
            </select>
        </div>
        <div>
            <label for="note">Note</label>
            <input type="text" id="note" name="note">
        </div>

        <button class="btn btn-outline-primary"
                type="submit">
            Crea
        </button>
    </form>

</div>

</body>

</html>
