<!DOCTYPE html>
<html lang="it"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main_layout}">

<head>
    <title>Alimentazioni</title>
</head>

<body>
<div layout:fragment="content">
    <form th:attr="hx-get=@{'/operazioni/alimentazioni/scatti'}"
          hx-ext="json-enc"
          hx-target="body"
          hx-swap="outerHTML">
        <button class="btn btn-outline-primary"
                type="submit">
            Alimentazione a Scatti
        </button>
    </form>
    <form
            hx-ext="json-enc"
            hx-target="body"
            hx-swap="outerHTML">
        <button class="btn btn-outline-primary"
                type="submit">
            Alimentazione a Tempo
        </button>
    </form>
    <form
            hx-ext="json-enc"
            hx-target="body"
            hx-swap="outerHTML">
        <button class="btn btn-outline-primary"
                type="submit">
            Alimentazioni Non fatte
        </button>
    </form>
</div>
</body>

</html>
