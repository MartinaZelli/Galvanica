<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main_layout}">

<head>
    <title>Aggiunta a scatti</title>
</head>

<body>
<div layout:fragment="content">
    <div class="card shadow mb-4">
        <div class="card-body">
            <table class="table table-bordered" id="dataTable">
                <thead>
                <tr>
                    <th scope="col">Bagno</th>
                    <th scope="col">Scatti</th>
                    <th scope="col">Pre-conto</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bagno: ${bagnoList}">
                    <td><span th:text="${bagno.getNome()}"></span>
                    </td>
                    <td>
                        <input type="number" th:name="${bagno.getIdBagno()}"
                               hx-trigger="input changed dalay:1000ms"
                               th:attr="hx-get=@{'/operazioni/alimentazioni/scatti/preconto/'+${bagno.getIdBagno()}},
                                hx-target=@{'#preconto'+${bagno.getIdBagno()}}"/>
                    </td>
                    <td th:id="@{'preconto'+${bagno.getIdBagno()}}"></td>
                </tr>
                </tbody>
            </table>
            <button class="btn btn-primary btn-icon-split btn-lg"
                    type="submit"
                    hx-post="/operazioni/alimentazioni/scatti"
                    hx-ext="json-enc"
                    hx-target="body"
                    hx-include="closest tr"
                    hx-swap="outerHTML"
            >
                    <span class="icon text-white-50">
                        <i class="fas fa-arrow-right"></i>
                    </span>
                <span class="text">Calcola Alimentazioni</span>
            </button>
        </div>
    </div>
</div>
</body>

</html>
