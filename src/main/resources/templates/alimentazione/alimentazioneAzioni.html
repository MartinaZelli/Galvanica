<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{layout/main_layout}">

<head>
	<title>Azioni su Alimentazione</title>
</head>

<body>
<div layout:fragment="content">

	<form th:attr="hx-put=@{'/alimentazione/'+${alimentazione.getIdAlimentazione()}}" hx-ext="json-enc"
			hx-target="body" hx-swap="outerHTML">
		<div>
			<label for="id">Id Alimentazione</label>
			<input type="text" disabled id="id" name="idAlimentazione" th:value="${alimentazione.getIdAlimentazione()}">
		</div>
		<div>
			<label for="idBagno">Bagno</label>
			<select id="idBagno" name="idBagno">
				<option></option>
				<option th:each="bagno: ${bagnoList}" th:value="${bagno.getIdBagno()}" th:text="${bagno.getNome()}"
						th:selected="${bagno.getIdBagno()==alimentazione.getIdBagno()}">
				</option>
			</select>
		</div>
		<div>
			<label for="descrizione">Descrizione</label>
			<input type="text" id="descrizione" name="descrizione" th:value="${alimentazione.getDescrizione()}">
		</div>
		<fieldset>
			<div>Seleziona tipo di Alimentazione:</div>
			<div>
				<input th:attr="hx-get=@{'/alimentazione/campiScatti/'+${alimentazione.getIdAlimentazione()}}"
						hx-trigger="change"
						hx-target="#campiTipoAlimentazione"
						hx-swap="innerHTML"
						type="radio"
						id="scatti"
						name="tipoAlimentazione"
						value="Scatti"
						th:checked="${alimentazione.getTipologiaAggiunta()=='Scatti'}"/>
				<label for="scatti">Scatti</label>

				<input th:attr="hx-get=@{'/alimentazione/campiTempo/'+${alimentazione.getIdAlimentazione()}}"
						hx-trigger="change"
						hx-target="#campiTipoAlimentazione"
						hx-swap="innerHTML"
						type="radio"
						id="tempo"
						name="tipoAlimentazione"
						value="Tempo"
						th:checked="${alimentazione.getTipologiaAggiunta()=='Tempo'}"/>
				<label for="tempo">Tempo</label>
			</div>
		</fieldset>
		<div th:switch="${alimentazione.getTipologiaAggiunta()}" id="campiTipoAlimentazione">
			<div th:case="Scatti">
				<p th:replace="~{alimentazione/campiTipoAlimentazione :: campiScatti}"
						th:with="alimentazione=${alimentazione}"></p>
			</div>
			<div th:case="Tempo">
				<p th:replace="~{alimentazione/campiTipoAlimentazione :: campiTempo}"
						th:with="alimentazione=${alimentazione},giorniList=${giorniList}"></p>
			</div>

		</div>


		<button class="btn btn-outline-primary" type="submit">Salva</button>
	</form>


	<form th:attr="hx-delete=@{'/alimentazione/'+${alimentazione.getIdAlimentazione()}}" hx-ext="json-enc"
			hx-target="body" hx-swap="outerHTML">
		<button class="btn btn-outline-primary" type="submit">Elimina l'intero oggetto</button>
	</form>

</div>
</body>

</html>
