<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" lang="it">
<head>
    <title>Elenco Bagni</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"
            integrity="sha384-0gxUXCCR8yv9FM2b+U3FDbsKthCI66oH5IA9fHppQq9DDMHuMauqq1ZHBpJxQ0J0"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <h1>Elenco Bagni</h1>
    <div class="card" th:each="bagno: ${bagni}">
        <div class="card-body">
            <div class="d-flex">
                <div>
                    <h5 class="card-title mb-0">
                        <span th:text="${bagno.getIdBagno()}"/>
                        <span th:text="${bagno.getNome()}"/>
                    </h5>
                    <div>Scatti Totali: <span th:text="${bagno.getScattiTotali()}"/></div>
                    <div>Resto Scatti: <span th:text="${bagno.getRestoScatti()}"/></div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <button class="btn btn-outline-primary"><i class="bi bi-heart"></i> Like</button>
                        <button class="btn btn-outline-secondary"><i class="bi bi-chat"></i> Comment</button>
                        <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card" id="replaceMe">
        <button
                hx-get="/elenco-bagni"
                hx-target="#replaceMe"
                hx-swap="outerHTML"
                class="btn btn-outline-primary">Load More...
            <img class="htmx-indicator" src="/spinner.gif" alt="Cacca"/>
        </button>
    </div>
</div>
</body>
</html>
