<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main_layout}">

<head>
    <title>Lista prodotti</title>
</head>

<body>
<div layout:fragment="content">
    <div>
        <a th:href="'/prodotto/new'">
            nuovo </a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th scope="col">Id Prodotto</th>
            <th scope="col">Nome</th>
            <th scope="col">Magazzino</th>
            <th scope="col">Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prodotto: ${prodottoList}">
            <td><span th:text="${prodotto.getIdProdotto()}"/>

            </td>
            <td><span th:text="${prodotto.getNome()}"/>

            </td>
            <td><span th:text="${prodotto.getIdMagazzino()}"/>,
                <span th:text="${prodotto.getNomeMagazzino()}"/>
            </td>
            <td><a th:href="'/prodotto/azioni/'+${prodotto.getIdProdotto()}">
                Modifica </a>
            </td>

        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
