<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main_layout}">

<head>
    <title>Azioni in Magazzino</title>
</head>

<body>
<div layout:fragment="content">
    <form th:attr="hx-put=@{'/magazzino/'+${magazzino.getIdMagazzino()}}"
          hx-ext="json-enc"
          hx-target="body"
          hx-swap="outerHTML">
        <div>
            <label for="id">Id Magazzino</label>
            <input type="text" disabled id="id" name="idMagazzino"
                   th:value="${magazzino.getIdMagazzino()}">
        </div>
        <div>
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" name="descrizione"
                   th:value="${magazzino.getDescrizione()}">
        </div>
        <button class="btn btn-outline-primary"
                type="submit">
            Salva
        </button>
    </form>
    <form th:attr="hx-delete=@{'/magazzino/'+${magazzino.getIdMagazzino()}}"
          hx-ext="json-enc"
          hx-target="body"
          hx-swap="outerHTML">
        <button class="btn btn-outline-primary"
                type="submit">
            Elimina l'intero oggetto
        </button>
    </form>
</div>
</body>

</html>
