<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" lang="it">
<head>
    <title>Home</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"
            integrity="sha384-0gxUXCCR8yv9FM2b+U3FDbsKthCI66oH5IA9fHppQq9DDMHuMauqq1ZHBpJxQ0J0"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11/dist/ext/json-enc.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
<div class="btn-group">
    <div class="dropdown">
        <a class="btn btn-secondary dropdown-toggle" href="#" role="button"
           data-bs-toggle="dropdown" aria-expanded="false">
            Azioni
        </a>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/bagno/list">Bagno</a></li>
            <li><a class="dropdown-item" href="/alimentazione/list">Alimentazione</a>
            </li>
            <li><a class="dropdown-item" href="/dettaglioAlimentazione/list">Dettaglio
                alimentazione</a></li>
            <li><a class="dropdown-item" href="/relazioneBagnoProdotto/list">Relazione
                bagno prodotto</a></li>
            <li><a class="dropdown-item" href="/magazzino/list">Magazzino</a></li>
            <li><a class="dropdown-item" href="/prodotto/list">Prodotto</a></li>
            <li><a class="dropdown-item" href="/caratteristicaBagno/list">Caratteristica
                bagno</a></li>
        </ul>
    </div>

</div>
<div>
    <a th:href="'/magazzino/new'">
        nuovo </a>
</div>
<table class="table">
    <thead>
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Descrizione</th>
        <th scope="col">Azioni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="magazzino: ${magazzinoList}">
        <td><span th:text="${magazzino.getIdMagazzino()}"/>

        </td>
        <td><span th:text="${magazzino.getDescrizione()}"/>

        </td>
        <td><a th:href="'/magazzino/azioni/'+${magazzino.getIdMagazzino()}">
            Modifica </a>

        </td>
    </tr>
    </tbody>
</table>
</body>

</html>
