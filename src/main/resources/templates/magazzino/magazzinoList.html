<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main_layout}">

<head>
    <title>Lista Magazzini</title>
</head>

<body>
    <div layout:fragment="content">
        <div>
            <a href="/magazzino/new">nuovo</a>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Descrizione</th>
                    <th scope="col">Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="magazzino: ${magazzinoList}">
                    <td><span th:text="${magazzino.getIdMagazzino()}"></span></td>
                    <td><span th:text="${magazzino.getDescrizione()}"></span></td>
                    <td><a th:href="'/magazzino/azioni/'+${magazzino.getIdMagazzino()}">Modifica</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
