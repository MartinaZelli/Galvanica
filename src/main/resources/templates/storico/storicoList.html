<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main_layout}">

<head>
    <title>Lista Storico Da Eseguire</title>
</head>

<body>
    <div layout:fragment="content">

        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Bagno</th>
                    <th scope="col">Data Creazione</th>
                    <th scope="col">Tipo Alimentazione</th>
                    <th scope="col">Dettagli Prodotti</th>
                    <th scope="col">Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="alimentazione: ${alimentazioneList}">
                    <td><span th:text="${alimentazione.getNomeBagno()}" />
                    </td>
                    <td><span th:text="${alimentazione.getTipoAlimentazione()}" />
                    </td>
                    <td>
                        <a
                            th:href="'/dettaglioAlimentazione/dettaglioAlimentazioneList/'+${alimentazione.getIdAlimentazione()}">
                            Mostra Dettagli Prodotti
                        </a>

                    </td>
                    <td>
                        <a th:href="'/dettaglioAlimentazione/vistaAzioni/'+${alimentazione.getIdAlimentazione()}">
                            Gestisci Dettagli Alimentazione </a>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
